<!DOCTYPE html>
<html lang="en"{% if is_dark %} class="dark"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --link-color: #0066cc;
            --link-visited: #551a8b;
            --link-hover: #004499;
            --meta-color: #666666;
            --border-color: #dddddd;
            --border-dark: #333333;
            --quote-color: #555555;
            --quote-border: #cccccc;
            --disabled-color: #cccccc;
        }
        :root.dark {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --link-color: #6699ff;
            --link-visited: #9999ff;
            --link-hover: #88bbff;
            --meta-color: #999999;
            --border-color: #444444;
            --border-dark: #888888;
            --quote-color: #bbbbbb;
            --quote-border: #666666;
            --disabled-color: #555555;
        }
        body {
            font-family: "Merriweather", Georgia, serif;
            margin: 1em;
            line-height: 1.5;
            font-size: 18px;
            max-width: 600px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .zone-left {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 20%;
            z-index: 1;
        }
        .zone-right {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 80%;
            z-index: 1;
        }
        h1, h2, h3, h4, h5, h6 {
            line-height: 1.2;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }
        h1 {
            font-size: 1.5em;
        }
        h2 {
            font-size: 1.3em;
        }
        h3, h4, h5, h6 {
            font-size: 1.1em;
        }
        p {
            margin-bottom: 1em;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1em 0;
        }
        blockquote {
            margin: 1em 0;
            padding-left: 1em;
            border-left: 3px solid var(--quote-border);
            color: var(--quote-color);
        }
        ul, ol {
            margin: 1em 0;
            padding-left: 2em;
        }
        li {
            margin-bottom: 0.5em;
        }
        a {
            color: var(--link-color);
            text-decoration: underline;
        }
        a:visited {
            color: var(--link-visited);
        }
        .article-footer {
            position: relative;
            z-index: 10;
            margin-top: 3em;
            padding-top: 1em;
            border-top: 2px solid var(--border-dark);
            text-align: center;
            font-size: 0.9em;
        }
        .article-footer a {
            margin: 0 0.5em;
        }
        .article-header {
            margin-bottom: 1.5em;
            padding-bottom: 0.5em;
            border-bottom: 1px solid var(--border-color);
        }
        .article-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 0.3em;
        }
        .article-meta {
            font-size: 0.9em;
            color: var(--meta-color);
        }
        .archive-form {
            display: inline;
        }
        .archive-button {
            background: none;
            border: none;
            color: var(--link-color);
            text-decoration: underline;
            cursor: pointer;
            font-size: inherit;
            font-family: inherit;
            padding: 0;
        }
        .archive-button:hover {
            color: var(--link-hover);
        }
    </style>
</head>
<body>
    <div class="zone-left" onclick="window.scrollBy(0, -window.innerHeight * 0.9)"></div>
    <div class="zone-right" onclick="window.scrollBy(0, window.innerHeight * 0.9)"></div>

    <div class="article-header">
        <div class="article-title">{{ title }}</div>
        {% if author or source %}
        <div class="article-meta">
            {% if author %}{{ author }}{% endif %}
            {% if author and source %} &middot; {% endif %}
            {% if source %}{{ source }}{% endif %}
        </div>
        {% endif %}
    </div>

    <div class="content">
        {{ content|safe }}
    </div>

    <div class="article-footer">
        <a href="/kindle/">Back to list</a>
        &middot;
        <form class="archive-form" method="post" action="/kindle/archive/{{ doc_id }}">
            <button type="submit" class="archive-button">Archive</button>
        </form>
    </div>

    <script>
    setInterval(function() {
        var p = window.scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight);
        new Image().src = '/kindle/progress/{{ doc_id }}?p=' + Math.min(1, p).toFixed(2);
    }, 30000);
    </script>
</body>
</html>
