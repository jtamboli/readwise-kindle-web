<!DOCTYPE html>
<html lang="en"{% if is_dark %} class="dark"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags - Readwise Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --link-color: #000000;
            --link-visited: #000000;
            --meta-color: #666666;
            --border-color: #dddddd;
            --border-dark: #000000;
        }
        :root.dark {
            --bg-color: #000000;
            --text-color: #ffffff;
            --link-color: #ffffff;
            --link-visited: #ffffff;
            --meta-color: #999999;
            --border-color: #444444;
            --border-dark: #ffffff;
        }
        /* Device dark mode (non-Kindle) - uses red text for better visibility on LCD/OLED screens */
        :root.device-dark {
            --bg-color: #000000;
            --text-color: #cc0000;
            --link-color: #cc0000;
            --link-visited: #cc0000;
            --meta-color: #990000;
            --border-color: #660000;
            --border-dark: #cc0000;
        }
        :root.device-dark img {
            filter: sepia(1) hue-rotate(-50deg) saturate(4) brightness(0.5);
        }
        body {
            font-family: "Merriweather", Georgia, serif;
            margin: 1em;
            line-height: 1.5;
            font-size: 16px;
            max-width: 600px;
            background-color: var(--bg-color);
            color: var(--text-color);
            /* E-ink optimizations */
            text-align: justify;
            hyphens: auto;
            -webkit-hyphens: auto;
            text-justify: inter-word;
            letter-spacing: 0.015em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 0.5em;
            border-bottom: 2px solid var(--border-dark);
            padding-bottom: 0.3em;
        }
        .back-link {
            margin-bottom: 1em;
            padding-bottom: 0.5em;
            border-bottom: 1px solid var(--border-color);
        }
        .back-link a {
            color: var(--link-color);
            text-decoration: none;
        }
        .back-link a:visited {
            color: var(--link-visited);
        }
        .tag-list {
            list-style: none;
            padding: 0;
        }
        .tag-item {
            margin-bottom: 1em;
            padding-bottom: 0.8em;
            border-bottom: 1px solid var(--border-color);
        }
        .tag-item:last-child {
            border-bottom: none;
        }
        .tag-name {
            font-size: 1.1em;
            font-weight: bold;
        }
        .tag-name a {
            color: var(--link-color);
            text-decoration: none;
        }
        .tag-name a:visited {
            color: var(--link-visited);
        }
        .tag-count {
            font-size: 0.9em;
            color: var(--meta-color);
            margin-left: 0.5em;
        }
        .empty-message {
            text-align: center;
            color: var(--meta-color);
            margin-top: 2em;
        }
        .count {
            font-size: 0.9em;
            color: var(--meta-color);
            margin-bottom: 1em;
        }
    </style>
</head>
<body>
    <div class="back-link">
        <a href="/kindle/">&larr; Back to Home</a>
    </div>

    <h1>Tags</h1>

    {% if tags %}
        <p class="count">{{ tags|length }} tag{% if tags|length != 1 %}s{% endif %}</p>
        <ul class="tag-list">
            {% for tag in tags %}
            <li class="tag-item">
                <div class="tag-name">
                    <a href="/kindle/tags/{{ tag.name }}">{{ tag.name }}</a>
                    <span class="tag-count">({{ tag.count }} article{% if tag.count != 1 %}s{% endif %})</span>
                </div>
            </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="empty-message">No tags found</p>
    {% endif %}

    <script>
    // System dark mode detection for non-Kindle devices (iPhones, iPads, Android, desktop browsers)
    // On these devices, use the system dark mode preference instead of sunrise/sunset calculations
    var isKindle = /Kindle/i.test(navigator.userAgent);

    if (!isKindle) {
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;

        // Remove server-side dark mode class
        root.classList.remove('dark');

        // Apply device-specific dark mode with red text if system is in dark mode
        if (prefersDark) {
            root.classList.add('device-dark');
        }

        // Listen for system dark mode changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (e.matches) {
                root.classList.remove('dark');
                root.classList.add('device-dark');
            } else {
                root.classList.remove('device-dark');
                root.classList.remove('dark');
            }
        });
    }
    </script>
</body>
</html>
