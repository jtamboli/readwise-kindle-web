[project]
name = "readwise-kindle-web"
version = "0.1.0"
description = "Mobile-friendly Kindle web reader for Readwise Reader's Later library"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0,<1.0",
    "uvicorn[standard]>=0.23.0,<1.0",
    "httpx>=0.24.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "bleach>=6.1.0,<7.0",
    "cachetools>=5.3.0,<6.0",
    "python-dotenv>=1.0.0,<2.0",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0",
    "pytest-asyncio>=0.21.0,<1.0",
]
